name: CI/CD Pipeline - NEXA Commerce

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Blue Image (v1.4)
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: BUILD_MODE=v1
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexa-commerce:v1.4

      - name: Build and Push Green Image (v2.0)
        uses: docker/build-push-action@v5
        with:
          context: .
          build-args: BUILD_MODE=v2
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nexa-commerce:v2.0
